[package]
name = "sarusctl"
version = "0.8.0"
edition = "2024"

[dependencies]
hpc-image-store = { path = "../hpc-image-store" }
clap = { version = "4.5.48", features = ["derive"] }
nu-ansi-term = "0.50.3"
raster = { git = "https://github.com/sarus-suite/raster" }
sarus-suite-podman-driver = { git = "https://github.com/sarus-suite/podman-driver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
users = "0.11.0"
uuid = { version = "1.4.1", features = ["v4"] }
saphyr-parser = "0.3.3"
saphyr = { version = "0.3.3", default-features = false }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
pretty_assertions = "1.4.1"
serial_test = "3.2.0"
tempfile = "3.20.0"
