[package]
name = "hpc-image-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
clap = { version = "4.5.48", features = ["derive"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
sha2 = "0.10"
